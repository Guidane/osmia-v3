{% if form.non_field_errors %}<div class="flash error">{{ form.non_field_errors|join:" " }}</div>{% endif %}
{% for f in form %}
  <div class="field{% if f.errors %} has-error{% endif %}">
    {% if f.widget_type == 'checkbox' %}<label class="inline">{{ f }} {{ f.label }}</label>{% else %}<label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% endif %}
    {% if f.help_text %}<div class="help">{{ f.help_text|safe }}</div>{% endif %}
    {{ f.errors }}
  </div>
{% endfor %}
