<div class="side-head"><h3>📌 Pinned pages</h3></div>
{% for p in pins %}<a class="side-link" href="{{ p.get_absolute_url }}">{{ p.emoji|default:"📄" }} {{ p.title }} <span class="muted small">· {{ p.space.name }}</span></a>
{% empty %}<p class="muted small">Pin a page with 📌 to keep it here.</p>{% endfor %}
