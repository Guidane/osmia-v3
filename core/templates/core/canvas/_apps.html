{% for group, apps in groups %}
{% if group %}<h4 class="app-group-title">{{ group }}</h4>{% endif %}
<div class="app-cards">
  {% for a in apps %}{% include "core/canvas/_app_card.html" %}{% endfor %}
  {% if new_card and forloop.last %}<a class="app-card new" href="{% url 'core:app_create' %}"><span class="app-card-icon">＋</span><span class="app-card-name">New app</span></a>{% endif %}
</div>
{% endfor %}
